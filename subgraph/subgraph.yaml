specVersion: 0.0.4
description: >
  Sentrix subgraph — indexes sentrix-dex (V2 fork) pair events on
  Sentrix Chain (chainId 7119). Phase 1 scope: PairCreated + Swap +
  Mint + Burn + Sync. Phase 2 (CoinBlast launchpad) and Phase 3
  (staking events) will be added as separate data sources in
  follow-up versions.

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: SentrixDexFactory
    # Sentrix Chain Mainnet (chainId 7119). graph-node config maps
    # the network alias 'sentrix' to https://rpc.sentrixchain.com.
    network: sentrix
    source:
      # SentrixV2Factory mainnet deploy (chain 7119) from sentrix-dex/deployments/7119.json,
      # deployed 2026-05-01. INIT_CODE_HASH 0xf7d8b4d1ce6c92cb3ce6b366dfb5977578db74e308b88facd5966df9e2a029dd.
      # For testnet (7120), switch to 0x8565392086cbA8D39cBba1F6f60ad1F1A17651C7 + change network alias to sentrix-testnet.
      address: "0xC5344f0DDE0B9916217449Ad9222e446475aD936"
      abi: SentrixDexFactory
      # TODO: pin Factory deploy block. The factory tx is
      # 0x03868af8e4c1db22d5968f4b15d6e5c41c342190406dd40bc226879e19280dbf — operator
      # can query its block height via cast or scan.sentrixchain.com and replace below.
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Pair
        - Token
        - SentrixDexFactory
      abis:
        - name: SentrixDexFactory
          file: ./abis/SentrixDexFactory.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: SentrixDexPair
          file: ./abis/SentrixDexPair.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated

templates:
  - kind: ethereum/contract
    name: SentrixDexPair
    network: sentrix
    source:
      abi: SentrixDexPair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/pair.ts
      entities:
        - Pair
        - Token
        - Swap
        - Mint
        - Burn
        - PairDayData
        - SentrixDayData
      abis:
        - name: SentrixDexPair
          file: ./abis/SentrixDexPair.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
