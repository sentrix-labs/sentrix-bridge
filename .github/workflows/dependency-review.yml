name: Dependency review

# Runs GitHub's dependency-review-action on PRs. Diffs the lockfile changes
# in the PR vs the base branch and BLOCKS merge if newly-introduced
# dependencies have vulnerabilities OR licenses outside our allowlist.
#
# Pair with Dependabot: Dependabot opens upgrade PRs; this gate enforces
# nothing bad slips in through manual deps changes that bypass Dependabot.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # so the action can post a summary comment

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          # Block merge on these severities; show all in comment.
          fail-on-severity: high
          # License allowlist mirrors the chain repo (sentrix-labs/sentrix).
          # NOTE: LZBL-1.2 (LayerZero source) isn't SPDX-recognized so the
          # action rejects it as an allowlist entry. LayerZero contracts ship
          # as git submodules / forge libs and don't surface in the GitHub
          # Dependency Graph anyway, so omitting it is not a coverage gap.
          allow-licenses: MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-DFS-2016, Unicode-3.0, CC0-1.0, 0BSD, MPL-2.0, Zlib, NCSA, BUSL-1.1, CDLA-Permissive-2.0
          # Build-time exemptions:
          # * `Swatinem/rust-cache` — copyleft GitHub Action; doesn't ship
          #   in bridge artifacts.
          # * `ark-std` / `semver-parser` — Cargo metadata declares the
          #   non-SPDX string `MIT/Apache-2.0` (should be `MIT OR
          #   Apache-2.0`). Both are dual-licensed under MIT and Apache-2.0
          #   per their own README/LICENSE files; allowlist the specific
          #   crates rather than blanket-accepting the malformed identifier.
          allow-dependencies-licenses: pkg:githubactions/Swatinem/rust-cache, pkg:cargo/ark-std, pkg:cargo/semver-parser
          comment-summary-in-pr: on-failure
